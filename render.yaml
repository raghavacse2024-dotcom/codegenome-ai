services:
  - type: web
    name: codegenome-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Never set SANDBOX_MODE=subprocess in production; production fails closed unless Docker or HTTPS SANDBOX_WORKER_URL is active.
      - key: SANDBOX_MODE
        value: auto
      - key: SANDBOX_WORKER_URL
        sync: false
      - key: SANDBOX_WORKER_TOKEN
        sync: false
      - key: SANDBOX_MAX_WORKSPACE_BYTES
        value: 10485760
      - key: SANDBOX_MAX_FILES
        value: 50
      - key: SANDBOX_MAX_EXECUTION_MS
        value: 8000
      - key: SANDBOX_MAX_MEMORY_MB
        value: 256
      - key: SANDBOX_MAX_CPUS
        value: 0.5
      - key: SANDBOX_MAX_PIDS
        value: 64
      - key: SANDBOX_MAX_OUTPUT_BYTES
        value: 32768
      - key: SANDBOX_MAX_CONCURRENT_JOBS
        value: 4
      - key: SANDBOX_MAX_USER_JOBS
        value: 2
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
